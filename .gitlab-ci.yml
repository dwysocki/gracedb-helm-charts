stages:
  - test
  - build
  - publish

variables:
  HELM_REPO_CHANNEL: "stable"

# Execute lint checks
# if the chart is modified
helm:lint:
  stage: build
  image: 
    name: alpine/helm:3.7.1
    entrypoint: [""] 
  script:
    - helm lint hopskotch
  rules:
    - changes:
        - hopskotch/*
    - when: never

# These steps build the Helm chart package
# and upload it to the helm-charts repo
# only when a tag is created
helm:build:
  stage: build
  image: 
    name: alpine/helm:3.7.1
    entrypoint: [""] 
  script:
    - helm package hopskotch --version ${CI_COMMIT_TAG}
  artifacts:
    paths:
      - hopskotch-${CI_COMMIT_TAG}.tgz
  only:
    - tags
  needs:
    - job: helm:lint
      optional: true

