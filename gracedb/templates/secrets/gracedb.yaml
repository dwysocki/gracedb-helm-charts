{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
data:
  DJANGO_SECRET_KEY: {{ .Values.secrets.djangoSecretKey | b64enc }}
  DJANGO_SUPERUSER_PASSWORD: {{ .Values.secrets.djangoSuperuserPassword | b64enc }}
  DJANGO_DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc }}
{{- end }}
