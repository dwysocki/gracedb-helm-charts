---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gracedb.fullname" . }}-memcached
  labels:
    {{- include "gracedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
spec:
  ports:
    - name: memcached
      port: 11211
      protocol: TCP
      targetPort: memcached
  selector:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gracedb.fullname" . }}-memcached
  labels:
    {{- include "gracedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: memcached
spec:
  replicas: {{ .Values.memcached.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: memcached
          image: "{{ .Values.memcached.image.repository | default "memcached" }}:{{ .Values.memcached.image.tag | default "1.6" }}"
          imagePullPolicy: {{ .Values.memcached.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP
          resources:
            {{- toYaml (.Values.memcached.resources | default dict) | nindent 12 }}
